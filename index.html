  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #020617;
      --card: rgba(255,255,255,0.07);
      --card2: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.12);
      --text: #ffffff;
      --muted: #cbd5e1;
      --soft: #94a3b8;
      --gold: #fbbf24;
      --gold2: #fde68a;
      --blue: #22d3ee;
      --navy: #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(251,191,36,.18), transparent 34%),
        radial-gradient(circle at top right, rgba(34,211,238,.15), transparent 32%),
        linear-gradient(180deg, #020617 0%, #020617 100%);
      color: var(--text);
      overflow-x: hidden;
    }

    a { color: inherit; text-decoration: none; }
    .container { width: min(1180px, calc(100% - 40px)); margin: 0 auto; }

    header {
      position: sticky; top: 0; z-index: 100;
      backdrop-filter: blur(18px);
      background: rgba(2, 6, 23, .82);
      border-bottom: 1px solid var(--border);
    }
    .nav {
      display: flex; align-items: center; justify-content: space-between;
      gap: 24px; padding: 16px 0;
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 260px; }
    .logoBox {
      height: 64px; width: 64px; flex: 0 0 64px;
      background: #fff; border-radius: 18px; padding: 7px;
      border: 1px solid var(--border);
      box-shadow: 0 18px 40px rgba(251,191,36,.18);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .logoBox img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .brandName { font-size: 24px; font-weight: 900; letter-spacing: -0.04em; line-height: 1; }
    .brandSub { color: var(--soft); font-size: 14px; margin-top: 6px; }
    .navLinks { display: flex; align-items: center; gap: 24px; color: var(--muted); font-size: 14px; font-weight: 600; }
    .navLinks a:hover { color: var(--gold2); }
    .languageSelect {
      background: rgba(255,255,255,.08); color: #fff;
      border: 1px solid var(--border); border-radius: 14px;
      padding: 10px 12px; outline: none;
    }
    .languageSelect option { background: #0f172a; color: #fff; }

    section { padding: 82px 0; }
    .hero { display: grid; grid-template-columns: 1.05fr .95fr; gap: 48px; align-items: center; padding-top: 88px; }
    .kicker {
      display: inline-flex; align-items: center; gap: 8px;
      border: 1px solid rgba(251,191,36,.32);
      background: rgba(251,191,36,.10); color: var(--gold2);
      padding: 10px 16px; border-radius: 999px;
      font-size: 14px; font-weight: 700; margin-bottom: 24px;
    }
    h1 { font-size: clamp(44px, 6vw, 78px); line-height: .97; letter-spacing: -0.07em; font-weight: 900; }
    .hero p { margin-top: 24px; color: var(--muted); font-size: 20px; line-height: 1.7; max-width: 690px; }
    .ctaRow { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 32px; }
    .btn {
      border: 1px solid var(--border); border-radius: 18px;
      padding: 16px 22px; font-weight: 900; display: inline-flex; align-items: center; gap: 10px;
      cursor: pointer; transition: .25s ease; font-size: 15px;
    }
    .btnPrimary { background: var(--gold); color: #06111f; border-color: var(--gold); }
    .btnPrimary:hover { transform: translateY(-2px); background: #fcd34d; }
    .btnSecondary { background: rgba(255,255,255,.06); color: #fff; }
    .btnSecondary:hover { background: rgba(255,255,255,.12); }
    .trust { margin-top: 28px; color: var(--soft); font-size: 14px; display: flex; gap: 8px; align-items: center; }

    .heroCard {
      position: relative; border: 1px solid var(--border); border-radius: 34px;
      background: rgba(255,255,255,.09); padding: 26px;
      box-shadow: 0 30px 90px rgba(0,0,0,.35);
    }
    .heroCard:before {
      content: ""; position: absolute; inset: -18px; border-radius: 42px;
      background: linear-gradient(135deg, rgba(251,191,36,.16), rgba(34,211,238,.10));
      filter: blur(26px); z-index: -1;
    }
    .talentOS { background: rgba(15,23,42,.85); border: 1px solid var(--border); border-radius: 28px; padding: 26px; }
    .osTop { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
    .osSmall { color: var(--soft); font-size: 14px; }
    .osTitle { font-size: 28px; font-weight: 900; margin-top: 4px; }
    .osIcon { font-size: 42px; }
    .workflow { display: grid; gap: 14px; }
    .workflowItem {
      display: flex; gap: 14px; align-items: center; padding: 16px;
      border: 1px solid var(--border); border-radius: 18px;
      background: rgba(255,255,255,.05);
    }
    .workflowIcon { font-size: 24px; }
    .workflowTitle { font-weight: 800; }
    .workflowSmall { color: var(--soft); font-size: 12px; margin-top: 3px; }

    .mediaStrip { border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); background: rgba(255,255,255,.03); padding: 28px 0; }
    .mediaGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
    .mediaLogo, .mediaCard {
      border: 1px solid var(--border); background: rgba(255,255,255,.06);
      border-radius: 20px; padding: 20px; text-align: center; font-weight: 900;
    }

    .sectionHead { max-width: 800px; margin-bottom: 40px; }
    .eyebrow { color: var(--gold); font-weight: 900; margin-bottom: 12px; }
    h2 { font-size: clamp(34px, 4vw, 56px); line-height: 1.05; letter-spacing: -0.055em; font-weight: 900; }
    .lead { margin-top: 18px; color: var(--muted); font-size: 18px; line-height: 1.75; }
    .features { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
    .featureCard, .infoCard, .founderCard, .contactCard {
      background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 28px;
    }
    .featureCard:hover { background: rgba(255,255,255,.10); transform: translateY(-4px); }
    .featureIcon { font-size: 38px; margin-bottom: 20px; }
    .featureCard h3 { font-size: 20px; margin-bottom: 12px; }
    .featureCard p, .infoCard p, .founderCard p { color: var(--muted); line-height: 1.75; }

    .twoCol { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .industryGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 20px; }
    .pill { padding: 14px; border: 1px solid var(--border); border-radius: 16px; background: rgba(255,255,255,.05); color: var(--muted); font-weight: 700; }
    .pill span { color: var(--gold); margin-right: 7px; }

    .mediaSection { background: rgba(255,255,255,.03); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }
    .mediaContent { display: grid; grid-template-columns: 1fr 1fr; gap: 44px; align-items: start; }
    .mediaCards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .mediaCard { text-align: left; padding: 26px; }
    .mediaCard small { display: block; color: var(--gold); margin-top: 12px; font-weight: 800; }
    .disclaimer { margin-top: 16px; color: #64748b; font-size: 13px; line-height: 1.6; }

    .founderContact { display: grid; grid-template-columns: 1fr 1fr; gap: 34px; align-items: start; }
    .founderPhoto {
      width: 120px; height: 120px; border-radius: 28px; overflow: hidden;
      background: rgba(255,255,255,.08); border: 1px solid var(--border);
      box-shadow: 0 22px 60px rgba(0,0,0,.35); margin-bottom: 26px;
    }
    .founderPhoto img { width: 100%; height: 100%; object-fit: cover; display: block; }

    form { display: grid; gap: 14px; margin-top: 22px; }
    label { display: block; color: var(--muted); font-size: 14px; font-weight: 700; margin-bottom: 8px; }
    input, textarea {
      width: 100%; background: rgba(15,23,42,.88); border: 1px solid rgba(148,163,184,.25);
      border-radius: 18px; color: #fff; padding: 15px 16px; font: inherit; outline: none;
    }
    input:focus, textarea:focus { border-color: var(--gold); }
    textarea { resize: vertical; min-height: 130px; }
    .submitBtn {
      border: 0; border-radius: 18px; padding: 17px; background: var(--gold);
      color: #020617; font-weight: 900; font-size: 16px; cursor: pointer;
    }
    .contactDetails { margin-top: 26px; color: var(--muted); display: grid; gap: 12px; }

    footer { border-top: 1px solid var(--border); padding: 28px 0; color: var(--soft); font-size: 14px; }
    .footerFlex { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
    .footerLinks { display: flex; gap: 20px; }

    [dir="rtl"] { text-align: right; }
    [dir="rtl"] .brand, [dir="rtl"] .workflowItem, [dir="rtl"] .trust { flex-direction: row-reverse; }
    [dir="rtl"] .pill span { margin-right: 0; margin-left: 7px; }

    @media (max-width: 1000px) {
      .navLinks { display: none; }
      .hero, .twoCol, .mediaContent, .founderContact { grid-template-columns: 1fr; }
      .features { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 640px) {
      .container { width: min(100% - 28px, 1180px); }
      section { padding: 58px 0; }
      .brandName { font-size: 19px; }
      .brandSub { font-size: 12px; }
      .logoBox { height: 54px; width: 54px; flex-basis: 54px; }
      .nav { align-items: flex-start; }
      .languageSelect { max-width: 105px; }
      .features, .mediaGrid, .mediaCards, .industryGrid { grid-template-columns: 1fr; }
      h1 { font-size: 43px; }
      .hero p { font-size: 17px; }
      .heroCard, .featureCard, .infoCard, .founderCard, .contactCard { padding: 22px; }
    }

</head>

    const languageSelect = document.getElementById('languageSelect');
    Object.keys(translations).forEach(key => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = translations[key].label;
      languageSelect.appendChild(option);
    });

    function setLanguage(lang) {
      const t = translations[lang] || translations.en;
      document.documentElement.lang = lang;
      document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.textContent = t[key];
      });

      document.getElementById('navLinks').innerHTML = t.nav.map((n, i) => {
        const ids = ['home','platform','industries','media','founder','contact'];
        return `<a href="#${ids[i]}">${n}</a>`;
      }).join('');

      document.getElementById('workflowList').innerHTML = t.stats.map((s, i) => `
        <div class="workflowItem">
          <div class="workflowIcon">${workflowIcons[i]}</div>
          <div><div class="workflowTitle">${s}</div><div class="workflowSmall">AI workflow layer ${i + 1}</div></div>
        </div>`).join('');

      document.getElementById('mediaStrip').innerHTML = mediaLogos.map(m => `<div class="mediaLogo">${m}</div>`).join('');
      document.getElementById('mediaCards').innerHTML = mediaLogos.map(m => `<div class="mediaCard"><h3>${m}</h3><small>Featured Media Coverage</small></div>`).join('');

      document.getElementById('featuresGrid').innerHTML = t.features.map((f, i) => `
        <div class="featureCard">
          <div class="featureIcon">${featureIcons[i]}</div>
          <h3>${f[0]}</h3>
          <p>${f[1]}</p>
        </div>`).join('');

      document.getElementById('industryGrid').innerHTML = t.industries.map(item => `<div class="pill"><span>✓</span>${item}</div>`).join('');
      ['Name','Company','Email','Phone','Need','Message'].forEach((name, i) => {
        const label = document.getElementById('label' + name);
        if (label) label.textContent = t.form[i];
      });
      document.querySelectorAll('input, textarea').forEach((el, i) => { if (t.form[i]) el.placeholder = t.form[i]; });
    }

    languageSelect.addEventListener('change', (e) => setLanguage(e.target.value));
    setLanguage('en');

    document.getElementById('contactForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const name = encodeURIComponent(document.getElementById('name').value || '');
      const company = encodeURIComponent(document.getElementById('company').value || '');
      const email = encodeURIComponent(document.getElementById('email').value || '');
      const phone = encodeURIComponent(document.getElementById('phone').value || '');
      const need = encodeURIComponent(document.getElementById('need').value || '');
      const message = encodeURIComponent(document.getElementById('message').value || '');
      const subject = `TSH AI Solutions Inquiry from ${decodeURIComponent(name)}`;
      const body = `Full Name: ${decodeURIComponent(name)}%0D%0ACompany: ${decodeURIComponent(company)}%0D%0AEmail: ${decodeURIComponent(email)}%0D%0APhone: ${decodeURIComponent(phone)}%0D%0AHiring Need: ${decodeURIComponent(need)}%0D%0A%0D%0AMessage:%0D%0A${decodeURIComponent(message)}`;
      window.location.href = `mailto:info@tshaisolutions.com?subject=${encodeURIComponent(subject)}&body=${body}`;
    });
  </script>
